repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        types: [c++]
        files: ^(include|src|tests|examples)/.*\.(h|hpp|cpp)$
  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        types: [yaml]
