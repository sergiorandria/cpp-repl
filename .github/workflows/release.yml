name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.3.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Artifacts (Ubuntu 24.04, LLVM 22)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install LLVM 22
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm22.list
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build llvm-22 llvm-22-dev clang-22 libclang-22-dev libclang-cpp22-dev libboost-all-dev libgmp-dev

      - name: Build Release
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22 -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm
          cmake --build build -j $(nproc)
          ./build/cpp-repl --version
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="auto-${{ github.sha }}"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          tar czf cpp-repl-${TAG}-linux-x86_64.tar.gz -C build cpp-repl
          sha256sum cpp-repl-${TAG}-linux-x86_64.tar.gz | tee SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Automatic Release {0}', github.sha) }}
          target_commitish: ${{ github.sha }}
          files: |
            cpp-repl-*.tar.gz
            SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: false

      - name: Upload artifact (manual dispatch fallback)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cpp-repl-release-${{ env.TAG || github.ref_name || inputs.tag || 'manual' }}
          path: |
            cpp-repl-*.tar.gz
            SHA256SUMS
